{% if messages %}<div class="space-y-2 mb-4">{% for m in messages %}<div class="rounded-xl px-3.5 py-2.5 text-sm" style="{% if m.tags == 'error' %}background:#fef2f2;color:#991b1b;border:1px solid #fecaca{% elif m.tags == 'warning' %}background:#fffbeb;color:#92400e;border:1px solid #fde68a{% else %}background:#ecfdf5;color:#065f46;border:1px solid #a7f3d0{% endif %}">{{ m }}</div>{% endfor %}</div>{% endif %}
{% if errors %}<div class="rounded-xl px-3.5 py-2.5 text-sm mb-4" style="background:#fef2f2;color:#991b1b;border:1px solid #fecaca">{% for e in errors %}<p>• {{ e }}</p>{% endfor %}</div>{% endif %}
