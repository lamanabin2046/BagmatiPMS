{# ऐच्छिक कागजात अपलोड (PDF / JPG / PNG) — doc: हालको फाइल (FieldFile), label: शीर्षक #}
<div class="mt-6 rounded-xl border border-dashed border-slate-300 bg-slate-50/60 p-4">
  <div class="flex flex-wrap items-start justify-between gap-3">
    <div>
      <p class="text-sm font-semibold text-slate-800"><i class="fas fa-paperclip text-brand-600 mr-1"></i>{{ label|default:"कागजात" }} <span class="text-xs font-normal text-slate-500">(ऐच्छिक)</span></p>
      <p class="text-xs text-slate-500 mt-0.5">स्क्यान गरेको प्रति वा PDF — PDF, JPG, PNG · १० MB सम्म</p>
    </div>
    {% if doc %}
    <div class="flex items-center gap-3 text-xs">
      <a href="{{ doc.url }}" target="_blank" rel="noopener" class="inline-flex items-center gap-1.5 px-2.5 py-1.5 rounded-lg bg-white border border-slate-200 text-brand-700 font-semibold hover:bg-brand-50"><i class="fas {% if doc.name|lower|slice:'-4:' == '.pdf' %}fa-file-pdf text-rose-600{% else %}fa-file-image text-teal-600{% endif %}"></i>हालको कागजात हेर्नुहोस्</a>
      <label class="inline-flex items-center gap-1.5 text-rose-700 cursor-pointer"><input type="checkbox" name="document_clear" value="1" class="form-check"> हटाउने</label>
    </div>
    {% endif %}
  </div>
  <input type="file" name="document" accept=".pdf,.jpg,.jpeg,.png,application/pdf,image/*" class="form-input mt-3 bg-white">
  {% if doc %}<p class="text-[11px] text-slate-500 mt-1">नयाँ फाइल छानेमा पुरानो बदलिन्छ।</p>{% endif %}
</div>
